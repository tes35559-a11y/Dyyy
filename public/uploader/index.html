<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DyyUploader — Foto &amp; Video jadi Link</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet">
<style>
:root{--tx:#f6f1ff;--mu:#b9acd6;--gl:rgba(255,255,255,.08);--bd:rgba(255,255,255,.16);--p:#c9a7ff;--k:#ff9ecf;--c:#8fe3ff;--er:#ff8fa3;--ok:#9af0c4}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:Poppins,system-ui,sans-serif;color:var(--tx);line-height:1.55;min-height:100vh;
background:radial-gradient(1200px 600px at 10% -10%,#4b2a7a 0,transparent 60%),radial-gradient(900px 600px at 100% 10%,#7a2a62 0,transparent 55%),radial-gradient(900px 700px at 50% 120%,#1f3d7a 0,transparent 60%),#120d22;background-attachment:fixed}
.blob{will-change:transform;position:fixed;border-radius:50%;filter:blur(70px);opacity:.35;z-index:0;pointer-events:none;animation:fl 14s ease-in-out infinite alternate}
.b1{width:280px;height:280px;background:var(--k);top:8%;left:-60px}
.b2{width:320px;height:320px;background:var(--c);bottom:5%;right:-80px;animation-delay:-6s}
@keyframes fl{to{transform:translate(40px,-30px) scale(1.12)}}
.w{position:relative;z-index:1;max-width:820px;margin:0 auto;padding:36px 16px 70px}
h1{font-family:'Playfair Display',serif;font-style:italic;text-align:center;font-size:clamp(2rem,6vw,3rem);margin:0;background:linear-gradient(90deg,var(--p),var(--k),var(--c));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{text-align:center;color:var(--mu);margin:6px 0 26px;font-size:.95rem}
.glass{background:var(--gl);border:1px solid var(--bd);border-radius:22px;padding:18px;margin-bottom:18px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 10px 40px rgba(0,0,0,.25)}
.drop{border:2px dashed var(--bd);border-radius:18px;padding:38px 16px;text-align:center;cursor:pointer;transition:.25s}
.drop:hover,.drop.on{border-color:var(--p);background:rgba(201,167,255,.08);transform:scale(1.01)}
.drop .ic{font-size:2.4rem}.drop b{display:block;margin:6px 0 2px}.drop span{color:var(--mu);font-size:.85rem}
.btn{border:0;border-radius:99px;padding:11px 22px;font:inherit;font-weight:600;font-size:.9rem;color:#2a1646;cursor:pointer;background:linear-gradient(90deg,var(--p),var(--k));transition:.2s;text-decoration:none;display:inline-block}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(255,158,207,.35)}
.btn:disabled{opacity:.55;cursor:not-allowed;transform:none;box-shadow:none}
.ghost{background:transparent;color:var(--p);border:1px solid var(--bd)}
.bar{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.err{display:none;margin-top:12px;padding:10px 16px;border-radius:14px;background:rgba(255,143,163,.12);border:1px solid rgba(255,143,163,.4);color:var(--er);font-size:.9rem}
.it{display:flex;gap:12px;align-items:center;padding:10px;border-radius:16px;background:rgba(0,0,0,.22);border:1px solid var(--bd);margin-bottom:10px}
.th{width:64px;height:64px;border-radius:12px;object-fit:cover;background:#000;flex:none}
.bd{flex:1;min-width:0}
.nm{font-size:.9rem;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{font-size:.75rem;color:var(--mu)}
.meta.ok{color:var(--ok)}.meta.er{color:var(--er)}
.pg{height:6px;border-radius:99px;background:rgba(255,255,255,.1);margin-top:6px;overflow:hidden;display:none}
.pg i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--c),var(--k));transition:width .15s}
.lk{display:none;gap:6px;margin-top:8px;flex-wrap:wrap}
.lk input{flex:1;min-width:150px;padding:8px 14px;border-radius:99px;border:1px solid var(--bd);background:rgba(0,0,0,.3);color:var(--tx);font:inherit;font-size:.8rem;outline:0}
.lk .btn{padding:7px 14px;font-size:.8rem}
.x{background:none;border:0;color:var(--mu);font-size:1.1rem;cursor:pointer;padding:4px 8px}
.x:hover{color:var(--er)}
.note{text-align:center;color:var(--mu);font-size:.75rem;margin-top:24px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(80px);background:#2a1646;border:1px solid var(--p);color:var(--tx);padding:10px 20px;border-radius:99px;font-size:.85rem;transition:.3s;z-index:9}
.toast.on{transform:translateX(-50%) translateY(0)}
</style>
<link rel="stylesheet" href="/assets/shell.css">
<link rel="stylesheet" href="/assets/drawer.css?v=20261016-notif1" data-adi-drawer-style="1">
<meta name="theme-color" content="#F1EDE3">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/assets/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/icon-180.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DyyMovie">
<meta name="format-detection" content="telephone=no">
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div>
<div class="w">
  <h1>DyyUploader</h1>
  <p class="sub">Ubah foto &amp; video jadi link yang siap dibagikan</p>

  <div class="glass">
    <div class="drop" id="drop" tabindex="0" role="button" aria-label="Pilih file">
      <div class="ic"><svg class="ico" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 18a4 4 0 0 1-.5-7.97A6 6 0 0 1 18 9.5a4.5 4.5 0 0 1-.5 8.5z"/><path d="M12 12v6M9.5 14.5L12 12l2.5 2.5"/></svg></div>
      <b>Seret &amp; lepas file di sini</b>
      <span>atau klik untuk memilih · bisa juga tempel (Ctrl+V) · foto &amp; video, maks 100 MB</span>
    </div>
    <input id="fi" type="file" accept="image/*,video/*" multiple hidden>
    <div class="err" id="err"></div>
  </div>

  <div class="glass" id="box" style="display:none">
    <div id="list"></div>
    <div class="bar">
      <button class="btn" id="up">Upload Semua</button>
      <button class="btn ghost" id="cp" style="display:none">Salin Semua Link</button>
      <button class="btn ghost" id="cl">Bersihkan</button>
    </div>
  </div>
  <p class="note">Link dibuat oleh layanan pihak ketiga dan bisa kedaluwarsa. Unggah hanya konten yang Anda miliki hak atasnya.</p>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";
var API="https://api.fazzcode.eu.cc/api/uguu",PROXY="/api/upload";
var KEY="fcs_live_52edc31a072157b9d9d138dae97bf19c9c3811e0";
var PROXY_MAX=4*1024*1024,MAX=100*1024*1024,FIELDS=["file","files[]","files"];
var $=function(i){return document.getElementById(i)};
var esc=function(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};
var items=[],seq=0,busy=false;

function size(b){return b>=1048576?(b/1048576).toFixed(1)+" MB":Math.max(1,Math.round(b/1024))+" KB"}
function toast(m){var t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(function(){t.classList.remove("on")},1800)}
function showErr(m){var e=$("err");e.textContent=m;e.style.display=m?"block":"none"}

// ---------- pilih file ----------
var drop=$("drop"),fi=$("fi");
drop.onclick=function(){fi.click()};
drop.onkeydown=function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();fi.click()}};
fi.onchange=function(){add(fi.files);fi.value=""};
["dragenter","dragover"].forEach(function(n){drop.addEventListener(n,function(e){e.preventDefault();drop.classList.add("on")})});
["dragleave","drop"].forEach(function(n){drop.addEventListener(n,function(e){e.preventDefault();drop.classList.remove("on")})});
drop.addEventListener("drop",function(e){add(e.dataTransfer.files)});
document.addEventListener("paste",function(e){var f=e.clipboardData&&e.clipboardData.files;if(f&&f.length)add(f)});

function add(fl){
  showErr("");var bad=[];
  Array.prototype.forEach.call(fl,function(f){
    if(!/^(image|video)\//.test(f.type)){bad.push(f.name+" (bukan foto/video)");return}
    if(f.size>MAX){bad.push(f.name+" (lebih dari 100 MB)");return}
    if(f.size===0){bad.push(f.name+" (kosong)");return}
    if(items.some(function(x){return x.f.name===f.name&&x.f.size===f.size&&x.f.lastModified===f.lastModified}))return;
    items.push({id:++seq,f:f,url:null,state:"wait",thumb:URL.createObjectURL(f)});
  });
  if(bad.length)showErr("Dilewati: "+bad.join(", "));
  draw();
}

function draw(){
  $("box").style.display=items.length?"block":"none";
  $("list").innerHTML=items.map(function(it){
    var isV=/^video\//.test(it.f.type);
    var th=isV?'<video class="th" muted preload="metadata" src="'+it.thumb+'#t=0.5"></video>':'<img class="th" alt="" src="'+it.thumb+'">';
    return '<div class="it" data-id="'+it.id+'">'+th+'<div class="bd"><div class="nm">'+esc(it.f.name)+'</div>'+
      '<div class="meta" id="m'+it.id+'">'+(isV?"Video · ":"Foto · ")+size(it.f.size)+' · menunggu</div>'+
      '<div class="pg" id="p'+it.id+'"><i></i></div>'+
      '<div class="lk" id="l'+it.id+'"><input readonly aria-label="Link"><button class="btn" data-a="c">Salin</button><a class="btn ghost" target="_blank" rel="noopener">Buka</a></div>'+
      '</div><button class="x" data-a="x" title="Hapus" aria-label="Hapus"><svg class="ico" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>';
  }).join("");
  items.forEach(function(it){if(it.state!=="wait")paint(it)});
  sync();
}
function sync(){
  var pend=items.some(function(i){return i.state==="wait"||i.state==="err"});
  $("up").disabled=busy||!pend;$("cl").disabled=busy;
  $("cp").style.display=items.filter(function(i){return i.url}).length>1?"inline-block":"none";
}
function paint(it){
  var m=$("m"+it.id);if(!m)return;
  var l=$("l"+it.id),p=$("p"+it.id);
  if(it.state==="load"){p.style.display="block";m.className="meta";}
  else p.style.display="none";
  if(it.state==="ok"){
    m.className="meta ok";m.textContent="Berhasil diupload";
    l.style.display="flex";l.querySelector("input").value=it.url;l.querySelector("a").href=it.url;
  }else if(it.state==="err"){m.className="meta er";m.textContent="Gagal: "+it.msg+" (klik Upload untuk coba lagi)"}
}
$("list").addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;
  var row=b.closest(".it"),id=+row.dataset.id,it=items.filter(function(x){return x.id===id})[0];if(!it)return;
  if(b.dataset.a==="x"){if(busy&&it.state==="load")return;URL.revokeObjectURL(it.thumb);items=items.filter(function(x){return x!==it});draw()}
  if(b.dataset.a==="c")copy(it.url);
});
$("list").addEventListener("focusin",function(e){if(e.target.tagName==="INPUT")e.target.select()});
$("cl").onclick=function(){items.forEach(function(i){URL.revokeObjectURL(i.thumb)});items=[];showErr("");draw()};
$("cp").onclick=function(){copy(items.filter(function(i){return i.url}).map(function(i){return i.url}).join("\n"))};

function copy(t){
  function fb(){var a=document.createElement("textarea");a.value=t;a.style.position="fixed";a.style.opacity="0";document.body.appendChild(a);a.select();var ok=false;try{ok=document.execCommand("copy")}catch(e){}a.remove();toast(ok?"Link disalin":"Salin manual ya")}
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(function(){toast("Link disalin")},fb);else fb();
}

// ---------- upload ----------
function xhr(url,body,headers,prog){
  return new Promise(function(res){
    var x=new XMLHttpRequest();x.open("POST",url);x.timeout=600000;
    Object.keys(headers||{}).forEach(function(k){x.setRequestHeader(k,headers[k])});
    if(prog&&x.upload)x.upload.onprogress=function(e){if(e.lengthComputable)prog(e.loaded/e.total)};
    x.onload=function(){res({status:x.status,text:x.responseText})};
    x.onerror=x.ontimeout=function(){res({status:0,text:""})};
    x.send(body);
  });
}
function flat(o,k,acc){
  if(o===null||o===undefined)return acc;
  if(typeof o==="string")acc.push([k,o]);
  else if(Array.isArray(o))o.forEach(function(v){flat(v,k,acc)});
  else if(typeof o==="object")Object.keys(o).forEach(function(n){flat(o[n],n,acc)});
  return acc;
}
function findUrl(data){
  var f=flat(data,"",[]).filter(function(e){return /^https?:\/\/\S+$/i.test(e[1])&&e[1].indexOf("api.fazzcode")<0});
  var pri=f.filter(function(e){return /url|link|file|result/i.test(e[0])})[0]||f[0];
  return pri?pri[1]:null;
}
function parse(text){
  var d=null;try{d=JSON.parse(text)}catch(e){var t=(text||"").trim();if(/^https?:\/\/\S+$/.test(t))d={url:t}}
  if(!d)return {err:"Respons API tidak valid."};
  if(typeof d==="object"&&(d.status===false||d.success===false||d.ok===false))return {err:d.message||d.error||"API menolak permintaan."};
  var u=findUrl(d);
  return u?{url:u}:{err:(d&&(d.message||d.error))||"Link tidak ditemukan pada respons API."};
}

async function viaProxy(it,prog){
  var r=await xhr(PROXY,it.f,{"Content-Type":"application/octet-stream","x-filename":encodeURIComponent(it.f.name),"x-mime":it.f.type||"application/octet-stream"},prog);
  if(r.status===0||r.status===404)return {skip:true};
  var j;try{j=JSON.parse(r.text)}catch(e){return {err:"Server mengembalikan respons tidak valid."}}
  if(j.error)return {err:j.error};
  return parse(JSON.stringify(j.data));
}
async function direct(it,prog){
  var lastErr="Upload gagal.",blocked=true;
  for(var i=0;i<FIELDS.length;i++){
    var fd=new FormData();fd.append(FIELDS[i],it.f,it.f.name);
    var r=await xhr(API+"?apikey="+encodeURIComponent(KEY),fd,{},prog);
    if(r.status===0&&i===0){ // coba dengan header key
      var fd2=new FormData();fd2.append(FIELDS[0],it.f,it.f.name);
      r=await xhr(API,fd2,{"x-api-key":KEY,"Authorization":"Bearer "+KEY},prog);
    }
    if(r.status===0){continue}
    blocked=false;
    if(r.status>=200&&r.status<300){var p=parse(r.text);if(p.url)return p;lastErr=p.err}
    else{var q=parse(r.text);lastErr=q.err||("API error "+r.status);if([400,415,422].indexOf(r.status)<0)break}
  }
  if(blocked)return {err:"File >4 MB diblokir browser (CORS). Coba file lebih kecil atau kompres dulu."};
  return {err:lastErr};
}
async function send(it){
  it.state="load";paint(it);
  var bar=$("p"+it.id).firstChild,m=$("m"+it.id);
  var prog=function(v){bar.style.width=Math.round(v*100)+"%";m.textContent="Mengupload "+Math.round(v*100)+"%"};
  prog(0);
  var r=null;
  if(it.f.size<=PROXY_MAX){r=await viaProxy(it,prog);if(r.skip)r=null}
  if(!r)r=await direct(it,prog);
  if(r.url){it.url=r.url;it.state="ok"}else{it.state="err";it.msg=r.err||"Upload gagal."}
  paint(it);
}
$("up").onclick=async function(){
  if(busy)return;busy=true;showErr("");sync();
  var todo=items.filter(function(i){return i.state==="wait"||i.state==="err"});
  for(var i=0;i<todo.length;i++){try{await send(todo[i])}catch(e){todo[i].state="err";todo[i].msg="Terjadi kesalahan tak terduga.";paint(todo[i])}}
  busy=false;sync();
  var ok=items.filter(function(i){return i.url}).length;if(ok)toast(ok+" link siap");
};
})();
</script>

</body>
