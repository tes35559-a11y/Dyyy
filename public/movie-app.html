<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description" content="DyyMovie — Streaming film, serial TV, dan anime gratis. Kualitas HD, subtitle Indonesia.">

<!-- NAVBAR -->
<nav class="nav" id="nav">

  </a>

    <a class="active" data-nav="home" onclick="routeToTab('home');return false;">Beranda</a>
    <a data-nav="popular" onclick="loadSection('popular');return false;">Populer</a>

<!-- HERO -->
<section class="hero" id="hero">
  <div class="hero-bg" id="heroBg"></div>
  <div class="hero-content">
    <div class="hero-badge"><span class="pulse"></span> Streaming Gratis</div>
    <h1 class="hero-title" id="heroTitle">Nonton Film &amp; Serial<br>Tanpa Batas</h1>
    <div class="hero-meta" id="heroMeta">
      <span class="score">★ 9.2</span>
      <span class="pill">HD</span>
      <span class="pill">2024</span>
      <span>DyyMovie</span>
    </div>
    <p class="hero-desc" id="heroDesc">
      Ribuan film dan serial TV dari seluruh dunia. Kualitas HD, subtitle Indonesia, dan pengalaman menonton yang mulus.
    </p>
    <div class="hero-actions">
